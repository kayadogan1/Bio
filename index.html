<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğan Kaya | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1117; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            margin: 0;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #58a6ff; 
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        p {
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .link-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background-color: #161b22;
            padding: 15px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .link-card:hover {
            background-color: #21262d;
            transform: translateY(-2px);
            border-color: #58a6ff;
        }

        .icon {
            font-size: 1.5rem;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .fa-github { color: #ffffff; }
        .fa-linkedin { color: #0077b5; }
        .fa-envelope { color: #D14836; }
        .fa-globe { color: #2f81f7; }

        footer {
            margin-top: 40px;
            color: #484f58;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <img src="https://github.com/kayadogan1.png" alt="Doğan Kaya" class="profile-img">
    
    <h1>Doğan Kaya</h1>
    <p>Backend Developer | Java & .NET Core</p>

    <div class="link-container">
        
        <a href="https://github.com/kayadogan1" class="link-card" target="_blank">
            <i class="fab fa-github icon"></i>
            <span>GitHub Profilim</span>
        </a>

        <a href="https://www.linkedin.com/in/dogann-kaya" class="link-card" target="_blank">
            <i class="fab fa-linkedin icon"></i>
            <span>LinkedIn</span>
        </a>

        <a href="mailto:dogann2536@gmail.com" class="link-card">
            <i class="fas fa-envelope icon"></i>
            <span>Bana Mail At</span>
        </a>

        </div>

    <footer>
        © 2024 Doğan Kaya
    </footer>

</body>
</html>
